<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#06100f">
  <title>NOCTIS güncelleniyor</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#030809;color:#e4eeea;font:16px system-ui,sans-serif}.card{max-width:34rem;margin:1rem;padding:2rem;border:1px solid #1d3938;border-radius:18px;background:#071314;text-align:center}p{color:#9bb4ad}</style>
</head>
<body><div class="card"><h1>NOCTIS güncelleniyor</h1><p id="status">Eski çevrimdışı kopya temizleniyor…</p></div>
<script>
(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('noctis-')).map(k=>caches.delete(k)))}document.getElementById('status').textContent='Güncelleme hazır. Uygulama açılıyor…'}finally{location.replace('./?updated=052')}})();
</script></body></html>
